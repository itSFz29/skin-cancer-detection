<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav">

            <a class="navbar-brand fw-bold" href="/">

                    <li class="nav-item">
                        <a class="nav-link px-3" href="/"><i class="fa-solid fa-house-chimney me-1"></i> Home</a>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3 btn btn-primary btn-sm text-dark fw-bold ms-lg-3 rounded-pill" href="/upload">

        </div>

    <main>

   <footer class="py-4 mt-5 border-top border-secondary border-opacity-25 text-center">
