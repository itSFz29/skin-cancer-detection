{% extends "layout.html" %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="upload-card p-5 shadow-lg rounded-4 bg-glass border-0 text-center">
                <div class="scanner-icon-wrap mb-4">
                    <i class="fa-solid fa-shield-virus fa-5x text-primary animate-pulse"></i>
                </div>
                <h2 class="fw-bold text-white mb-2">Lesion Analysis</h2>
                <p class="text-secondary mb-4">Upload a high-resolution dermoscopic image to begin the AI-driven classification process.</p>
                
                <form action="/upload" method="post" enctype="multipart/form-data" class="text-start">
                    <div class="upload-zone p-4 border border-2 border-dashed border-primary rounded-4 mb-4 text-center">
                        <input type="file" name="image" id="imageUpload" class="form-control d-none" accept="image/*" required onchange="updateFileName()">
                        <label for="imageUpload" class="cursor-pointer">
                            <i class="fa-solid fa-file-image fa-2x text-primary mb-2"></i>
                            <p id="fileNameDisplay" class="mb-0 text-info">Click to choose or drag an image here</p>
                        </label>
                    </div>
                    <!-- Sample Images -->
<div class="text-center mb-4">
    <p class="text-white fw-bold mb-3">
        Don't have an image? Try one of our sample images.
    </p>

    <div class="row g-3">

        <div class="col-4">
            <a href="{{ url_for('sample_prediction', filename='sample1.jpg') }}"
               class="text-decoration-none">
                <img src="{{ url_for('static', filename='samples/sample1.jpg') }}"
                     class="img-fluid rounded-3 shadow"
                     alt="Sample skin lesion 1"
                     style="height: 100px; width: 100%; object-fit: cover;">
                <small class="text-info d-block mt-2">Sample 1</small>
            </a>
        </div>

        <div class="col-4">
            <a href="{{ url_for('sample_prediction', filename='sample2.jpg') }}"
               class="text-decoration-none">
                <img src="{{ url_for('static', filename='samples/sample2.jpg') }}"
                     class="img-fluid rounded-3 shadow"
                     alt="Sample skin lesion 2"
                     style="height: 100px; width: 100%; object-fit: cover;">
                <small class="text-info d-block mt-2">Sample 2</small>
            </a>
        </div>

        <div class="col-4">
            <a href="{{ url_for('sample_prediction', filename='sample3.jpg') }}"
               class="text-decoration-none">
                <img src="{{ url_for('static', filename='samples/sample3.jpg') }}"
                     class="img-fluid rounded-3 shadow"
                     alt="Sample skin lesion 3"
                     style="height: 100px; width: 100%; object-fit: cover;">
                <small class="text-info d-block mt-2">Sample 3</small>
            </a>
        </div>

    </div>
</div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-lg py-3 fw-bold">
                        <i class="fa-solid fa-gear fa-spin me-2"></i>Run Diagnosis
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function updateFileName() {
    const input = document.getElementById('imageUpload');
    const display = document.getElementById('fileNameDisplay');
    display.innerText = input.files[0] ? input.files[0].name : "Click to choose or drag an image here";
}
</script>
{% endblock %}
